<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify 2FA Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title text-center mb-4">Two-Factor Authentication</h4>

                        <div id="alertBox"></div>

                        <form id="verifyForm">
                            <div class="mb-3">
                                <label for="code" class="form-label">Enter the 6-digit code sent to your phone:</label>
                                <input type="text" class="form-control" id="code" placeholder="123456" required>
                            </div>
                            <button type="submit" id="verifyBtn" class="btn btn-primary w-100">Verify</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("verifyForm");
        const alertBox = document.getElementById("alertBox");
        const verifyBtn = document.getElementById("verifyBtn");

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const code = document.getElementById("code").value.trim();
            verifyBtn.disabled = true;
            verifyBtn.textContent = "Verifying...";

            fetch("/verify", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ code })
            })
            .then(res => res.json().then(data => ({ ok: res.ok, data })))
            .then(({ ok, data }) => {
                verifyBtn.disabled = false;
                verifyBtn.textContent = "Verify";

                if (ok && data.token) {
                    showAlert("Verification successful! Token: " + data.token, "success");
                    // Optionally store the token or redirect:
                    localStorage.setItem("token", data.token);
                    window.location.href = "/dashboard.html";
                } else {
                    const error = data.error || "Verification failed.";
                    showAlert(error, "danger");
                }
            })
            .catch(err => {
                verifyBtn.disabled = false;
                verifyBtn.textContent = "Verify";
                showAlert("Something went wrong. Try again.", "danger");
            });
        });

        function showAlert(message, type) {
            alertBox.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }
    </script>

</body>
</html>
