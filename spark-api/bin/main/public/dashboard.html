<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1055;
        }
    </style>
</head>
<body class="container mt-5">
    <h1>Welcome to Your Dashboard</h1>
    <p>You have successfully logged in and passed two-factor authentication.</p>

    <!-- Toast container -->
    <div id="toast-container">
        <div class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    ✅ Secure login complete! Welcome back.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="mb-3 mt-4">
        <input type="text" id="searchInput" class="form-control" placeholder="Search assets by keyword...">
        <button class="btn btn-secondary mt-2" onclick="performSearch()">Search</button>
    </div>

    <!-- Search Results -->
    <div id="resultsContainer" class="mt-4"></div>

    <!-- Bootstrap JS (for toast functionality) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Show success toast on page load
        window.addEventListener('load', () => {
            const toastEl = document.querySelector('.toast');
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        });

        function performSearch() {
    const query = document.getElementById('searchInput').value;
    const username = localStorage.getItem("username"); // 👈 grab stored user

    fetch(`/search?query=${encodeURIComponent(query)}&username=${encodeURIComponent(username)}`)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = ""; // Clear old results

            if (data.length === 0) {
                container.innerHTML = "<p>No assets found.</p>";
            } else {
                data.forEach(asset => {
                    const card = document.createElement('div');
                    card.className = "card mb-3 p-3";
                    card.innerHTML = `
                        <h5><strong>URI:</strong> ${asset.uri}</h5>
                        <p><strong>Contents:</strong> ${asset.contents}</p>
                    `;
                    container.appendChild(card);
                });
            }
        })
        .catch(error => {
            console.error("Search failed:", error);
            alert("An error occurred while searching.");
        });
}

    </script>
</body>
</html>
