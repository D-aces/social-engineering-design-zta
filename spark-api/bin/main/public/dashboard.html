<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1055;
        }
    </style>
</head>
<body class="container mt-5">
    <h1>Welcome to Your Dashboard</h1>
    <p>You have successfully logged in and passed two-factor authentication.</p>

    <!-- Toast container -->
    <div id="toast-container">
        <div class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    ✅ Secure login complete! Welcome back.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (for toast functionality) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Show the toast on page load
        window.addEventListener('load', () => {
            const toastEl = document.querySelector('.toast');
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        });
    
        const username = localStorage.getItem("username");
        if (username) {
            document.getElementById("userName").textContent = username;
        }

        // Example: display token stored from verification success
        const token = localStorage.getItem("token");
        if (token) {
            document.getElementById("tokenText").textContent = token;
            document.getElementById("tokenAlert").style.display = "block";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "/login.html";
        }
    </script>

</body>
</html>
